services:
  db:
    image: postgres:16-alpine
    container_name: skillproof-db
    environment:
      POSTGRES_DB: skillproof
      POSTGRES_USER: skillproof
      POSTGRES_PASSWORD: skillproof
    ports:
      - "5433:5432"
    volumes:
      - skillproof_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillproof -d skillproof"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  skillproof_pgdata:
